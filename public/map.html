<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Road Inventory Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100vh; width: 100%; }
  #status {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 8px 12px;
    border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    font-size: 13px;
  }
  .legend {
    position: absolute; bottom: 20px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 10px 12px;
    border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    font-size: 12px; line-height: 1.6;
  }
  .legend i { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; }
  .popup-table { font-size: 13px; border-collapse: collapse; }
  .popup-table td { padding: 2px 6px; vertical-align: top; }
  .popup-table td:first-child { font-weight: 600; color: #555; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Loading roads...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

var API_URL = 'http://localhost:3000/roads';

var map = L.map('map').setView([10.3157, 123.8854], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var statusEl = document.getElementById('status');

function colorForCondition(condition) {
  if (!condition) return '#888888';
  var c = String(condition).toLowerCase();
  if (c.indexOf('good') !== -1) return '#2ecc71';
  if (c.indexOf('fair') !== -1) return '#f1c40f';
  if (c.indexOf('poor') !== -1) return '#e67e22';
  if (c.indexOf('bad') !== -1) return '#e74c3c';
  return '#888888';
}

function styleFeature(feature) {
  return {
    color: colorForCondition(feature.properties.r_con),
    weight: 3,
    opacity: 0.85
  };
}

function buildPopup(feature) {
  var p = feature.properties || {};
  var rows = [
    ['Road Name', p.r_name],
    ['Condition', p.r_con],
    ['District', p.district],
    ['Barangay', p.brgy_name],
    ['Length (m)', p.r_length],
    ['Class', p.r_class],
    ['Surface', p.s_type]
  ];
  var html = '<table class="popup-table">';
  for (var i = 0; i < rows.length; i++) {
    var label = rows[i][0];
    var value = rows[i][1];
    if (value === null || value === undefined || value === '') value = '—';
    html += '<tr><td>' + label + '</td><td>' + value + '</td></tr>';
  }
  html += '</table>';
  return html;
}

function onEachFeature(feature, layer) {
  layer.bindPopup(buildPopup(feature));
  layer.on('mouseover', function () { layer.setStyle({ weight: 6 }); });
  layer.on('mouseout', function () { layer.setStyle({ weight: 3 }); });
}

statusEl.textContent = 'Fetching from API...';

fetch(API_URL)
  .then(function (response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(function (geojson) {
    var count = (geojson.features || []).length;
    statusEl.textContent = 'Rendering ' + count + ' roads...';
    var layer = L.geoJSON(geojson, {
      style: styleFeature,
      onEachFeature: onEachFeature
    }).addTo(map);
    try {
      map.fitBounds(layer.getBounds(), { padding: [20, 20] });
    } catch (e) {
      // bounds may fail if no features; ignore
    }
    statusEl.textContent = count + ' roads loaded';
  })
  .catch(function (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.style.color = '#c00';
    console.error(err);
  });

var legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  var div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<strong>Condition</strong><br>' +
    '<i style="background:#2ecc71"></i> Good<br>' +
    '<i style="background:#f1c40f"></i> Fair<br>' +
    '<i style="background:#e67e22"></i> Poor<br>' +
    '<i style="background:#e74c3c"></i> Bad<br>' +
    '<i style="background:#888888"></i> Unknown';
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
